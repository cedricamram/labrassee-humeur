<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L'humeur du boss — TV cuisine · La Brassée</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Playfair+Display:ital,wght@1,500;1,600&family=Inter:wght@600;700;800&display=swap" rel="stylesheet"/>
<style>
  :root{--jaune:#F5C518;--encre:#17130B;--creme:#F7EFD8;--rouge:#E8563F;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100vh;overflow:hidden;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;background:#0b0804;}
  .stage{position:relative;width:100vw;height:100vh;display:grid;grid-template-rows:auto 1fr auto;
    padding:5.2vh 4.5vw;transition:background .8s ease,color .8s ease;color:var(--creme);--acc:var(--jaune);
    background:radial-gradient(140vw 120vh at 74% 24%,rgba(247,209,53,.17),rgba(247,209,53,0) 58%),linear-gradient(160deg,#1b160d,#0b0804);}
  .glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:85vmin;height:85vmin;opacity:.15;pointer-events:none;z-index:0;animation:respire 8s ease-in-out infinite;filter:drop-shadow(0 0 3vmin rgba(247,209,53,.5));}@keyframes respire{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.04)}}

  .head{display:flex;align-items:center;justify-content:space-between;z-index:2;}
  .brand{display:flex;align-items:center;gap:1.4vw;}
  .brand img{width:6.4vh;height:6.4vh;object-fit:contain;}
  .brand .nom{font-family:'Anton';font-size:4.2vh;letter-spacing:1px;text-transform:uppercase;line-height:.9;}
  .brand .sub{font-weight:800;font-size:1.7vh;letter-spacing:.3em;text-transform:uppercase;opacity:.55;margin-top:.35vh;}
  .title{text-align:right;}
  .title .k{font-weight:800;font-size:2.7vh;letter-spacing:.32em;text-transform:uppercase;color:var(--acc);}
  .title .d{font-weight:700;font-size:2.2vh;letter-spacing:.05em;opacity:.6;margin-top:.6vh;text-transform:capitalize;}

  .mid{display:grid;grid-template-columns:1fr auto;align-items:center;gap:3.5vw;z-index:2;min-height:0;}
  .center{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-width:0;}
  .emoji{font-size:23vh;line-height:1;animation:bob 4.5s ease-in-out infinite;filter:drop-shadow(0 2vh 4vh rgba(0,0,0,.4));}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.4vh)}}
  .label{font-family:'Anton';font-size:13vh;line-height:.86;text-transform:uppercase;letter-spacing:1px;color:var(--acc);
    text-shadow:0 0 8vh rgba(247,209,53,.22),0 1.4vh 4vh rgba(0,0,0,.5);margin-top:1vh;}
  .msg{font-family:'Playfair Display';font-style:italic;font-size:5.6vh;line-height:1.25;max-width:48vw;margin-top:2.4vh;opacity:.95;}

  .qr{background:#fff;color:var(--encre);border-radius:2.6vh;padding:2.8vh 2.8vh 2.3vh;display:flex;flex-direction:column;align-items:center;gap:1.5vh;
    box-shadow:0 4vh 9vh rgba(0,0,0,.45);flex-shrink:0;}
  .qr img{width:21vh;height:21vh;display:block;image-rendering:pixelated;}
  .qr .big{font-family:'Anton';font-size:4vh;text-transform:uppercase;line-height:.92;text-align:center;}
  .qr .url{font-weight:800;font-size:1.45vh;letter-spacing:.06em;color:rgba(23,19,11,.55);}

  .foot{display:flex;align-items:center;justify-content:space-between;z-index:2;font-weight:700;font-size:2.4vh;opacity:.6;}

  /* ── Ambiances d'humeur (sombre/froid = grognon · or = euphorique) ── */
  .lvl-0{background:radial-gradient(140vw 120vh at 74% 24%,rgba(247,209,53,.05),transparent 58%),linear-gradient(160deg,#171410,#070605);--acc:#C9B86A;}
  .lvl-1{background:radial-gradient(140vw 120vh at 74% 24%,rgba(232,86,63,.24),transparent 58%),linear-gradient(160deg,#2a120e,#0c0605);--acc:#F7C9C0;}
  .lvl-2{background:radial-gradient(140vw 120vh at 74% 24%,rgba(255,150,40,.24),transparent 58%),linear-gradient(160deg,#2a1c0b,#0c0805);--acc:#FFC56B;}
  /* lvl-3 = défaut (premium dark + halo or) */
  .lvl-4{background:radial-gradient(150vw 130vh at 50% 36%,#FFE680,#F5C518 56%,#E08A00 100%);--acc:#7A1F12;color:var(--encre);}
  .lvl-4 .glow{display:none;}.lvl-4 .qr{box-shadow:0 4vh 9vh rgba(122,31,18,.3);}
  .lvl-4 .title .d,.lvl-4 .brand .sub,.lvl-4 .foot{opacity:.72;}
  .lvl-absent{background:radial-gradient(140vw 120vh at 50% 30%,rgba(120,220,235,.3),transparent 60%),linear-gradient(160deg,#0c2230,#06121a);--acc:#9BE8F2;}
  .lvl-pending{background:linear-gradient(160deg,#f7efd8,#e8dcc0);--acc:#9a7a1a;color:var(--encre);}
  .lvl-pending .glow{opacity:.18;}
</style>
</head>
<body>
<div class="stage lvl-3" id="stage">
  <svg class="glow" xmlns="http://www.w3.org/2000/svg" id="Layer_1" data-name="Layer 1" viewBox="0 0 235.02 235.08"><defs><style>.cls-1{fill:none;stroke:#F5C518;stroke-miterlimit:10;stroke-width:1.6;}</style></defs><path class="cls-1" d="M117.59.5c65,.09,117.51,53.2,116.93,118A117,117,0,1,1,117.59.5Zm56.69,205.89-.63.27c-.53.13-1.12.27-1.65.45-16.27,5.64-32.9,7.7-49.84,3.8A79.77,79.77,0,0,1,78,184.47a57.34,57.34,0,0,1-13.09-27.11,20.46,20.46,0,1,0-37.33,15.06,105,105,0,0,0,17.88,21.82C70.62,217,100,226.42,133.72,221.67a101.75,101.75,0,0,0,38.9-14.21c.36-.26.72-.58,1.08-.89l.72-.27-.09-.05.09,0Zm3.23-14.66c-3.09.9-6.19,1.84-9.28,2.6a59.22,59.22,0,0,1-23.53.94,58.52,58.52,0,0,1-34.42-18.55,54.89,54.89,0,0,1-13.35-24.29c-1.12-4.66-6.5-8.25-11.3-7.62a10.45,10.45,0,0,0-9.18,11.65,8.47,8.47,0,0,0,.31,1.53,45.35,45.35,0,0,0,4.62,11.47,57.92,57.92,0,0,0,17.47,18.82,69.34,69.34,0,0,0,40.43,13,86.44,86.44,0,0,0,17.93-1.88,81.93,81.93,0,0,0,19.45-6.77,3.19,3.19,0,0,0,.85-.9l.4.05v-.09ZM69.77,141.27c.36-.36.67-.72,1-1.08,6-6.05,13.23-8.38,21.52-6.18,8.47,2.24,13.85,7.8,16,16.36a20.05,20.05,0,0,0,.76,2.46,46.54,46.54,0,0,0,11.78,18.11c11.3,10.66,24.7,15.06,40,13a77.52,77.52,0,0,0,35.67-14.7A62.87,62.87,0,0,0,220.62,135c2.92-10.13,2.78-20.48,1.48-30.79a102.24,102.24,0,0,0-10.58-34.28c-11-21.34-27.33-37.34-49-47.64a103.25,103.25,0,0,0-58-9.33A101.18,101.18,0,0,0,70.44,23.22,105.56,105.56,0,0,0,12,113.89a102.68,102.68,0,0,0,2,24.24c.58,2.87,1.35,5.65,2.11,8.83,5.82-10.08,14-16.09,25.36-17.25S62.19,132.75,69.77,141.27Z" transform="translate(0 0)"></path></svg> 
  <div class="head">
    <div class="brand"><div><div class="nom">La Brassée</div><div class="sub">Café · Concerts · Buanderie</div></div></div>
    <div class="title"><div class="k">L'humeur du boss</div><div class="d" id="date">—</div></div>
  </div>
  <div class="mid">
    <div class="center">
      <div class="emoji" id="emoji">…</div>
      <div class="label" id="label">Chargement…</div>
      <div class="msg" id="msg">—</div>
    </div>
    <div class="qr">
      <img id="qr-img" alt="Scannez pour voter">
      <div class="big">Votez<br>maintenant</div>
      <div class="url" id="qr-url">humeur.labrassee.cafe</div>
    </div>
  </div>
  <div class="foot"><div id="votes">— votes aujourd'hui</div><div id="time">—</div></div>
</div>

<script type="module">
  import { getStatus, currentSlide, qrImgUrl, VOTE_URL } from "./app.js";

  document.getElementById("qr-img").src = qrImgUrl(VOTE_URL, 480);
  document.getElementById("qr-url").textContent = VOTE_URL.replace("https://", "").replace(/\/$/, "");

  function classOf(slide){
    if (slide.kind === "absent") return "lvl-absent";
    if (slide.kind === "pending") return "lvl-pending";
    return "lvl-" + slide.lvl;
  }
  function render(slide){
    document.getElementById("stage").className = "stage " + classOf(slide);
    document.getElementById("emoji").textContent = slide.e;
    document.getElementById("label").textContent = slide.t.toUpperCase();
    document.getElementById("msg").textContent = slide.m;
    document.getElementById("votes").textContent = slide.votes !== null
      ? `${slide.votes} vote${slide.votes>1?"s":""} aujourd'hui` : "Boss en congé";
  }
  function updateTime(){
    const d = new Date();
    document.getElementById("date").textContent = d.toLocaleDateString("fr-CA",{weekday:"long",day:"numeric",month:"long",timeZone:"America/Toronto"});
    document.getElementById("time").textContent = "Mis à jour à " + d.toLocaleTimeString("fr-CA",{hour:"2-digit",minute:"2-digit",timeZone:"America/Toronto"});
  }
  let lastStatus = null;
  async function tick(){
    try{ const status = await getStatus(); lastStatus = status; render(currentSlide(status)); updateTime(); }
    catch(e){ /* garde le dernier rendu */ }
  }
  setInterval(()=>{ if(lastStatus?.etat?.absent){ render(currentSlide(lastStatus)); updateTime(); } }, 4000);
  tick();
  setInterval(tick, 20000);
</script>
</body>
</html>
